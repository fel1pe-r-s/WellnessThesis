services:
  db:
  # Using Postgres 15 to match Supabase defaults closely or recent standard
    image: postgres:15-alpine
    container_name: wellnessthesis-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: wellness_thesis
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
